<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voces y Miradas de la Investigación</title>
<style>
  body { margin: 0; min-height: 100vh; font-family: Georgia, serif; color: #f2f2f2;
    background: linear-gradient(160deg, #3a3a3a 0%, #1f1f1f 55%, #0d0d0d 100%); }
  .encabezado { padding: 24px 28px; text-align: left; border-left: 8px solid #ff6600; margin: 24px 0 0 24px; }
  .inst { margin: 4px 0; font-size: 0.95em; color: #e8e8e8; }
  .inst.univ { font-size: 1.2em; color: #ff6600; font-weight: bold; }
  .inst.area { font-style: italic; color: #cfcfcf; }
  .centro { display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 60vh; padding: 20px; text-align: center; }
  .recuadro { border: 3px solid #ff6600; padding: 36px 40px; max-width: 640px;
    background: rgba(255,255,255,0.04); box-shadow: 0 10px 24px rgba(0,0,0,0.5); }
  h1 { margin: 0 0 12px; font-size: 2.2em; letter-spacing: 1px; }
  p.sub { margin: 0; color: #bdbdbd; font-style: italic; }
  a.entrar { display: inline-block; margin-top: 36px; padding: 14px 34px; background: #8a1050; color: #fff;
    text-decoration: none; font-size: 1.1em; border-radius: 4px; box-shadow: 0 6px 14px rgba(0,0,0,0.5); }
  a.entrar:hover { background: #a8135f; }
</style>
</head>
<body>
<div class="encabezado">
  <p class="inst univ">Universidad Nacional de San Luis</p>
  <p class="inst">Facultad de Ciencias Humanas</p>
  <p class="inst">Departamento de Educación y Formación Docente</p>
  <p class="inst area">Área 6 · Metodológica</p>
</div>

<div class="centro">
  <div class="recuadro">
    <h1>Voces y Miradas de la Investigación</h1>
    <p class="sub">Producciones de estudiantes de Metodología de la Investigación</p>
  </div>
  <a class="entrar" href="galeria3d.html">Entrar a la galería</a>
</div>
</body>
</html>

</div>
<audio id="musicaFondo" src="musica.mp3" loop preload="auto"></audio>
<button id="botonMusica" style="position:fixed;bottom:16px;right:16px;z-index:99999;background:rgba(20,20,20,0.75);color:#fff;border:2px solid #ff6600;border-radius:24px;padding:10px 16px;font-size:15px;cursor:pointer;font-family:sans-serif;">🔊 Música</button>
<script>
(function () {
  var audio = document.getElementById('musicaFondo');
  var boton = document.getElementById('botonMusica');
  audio.volume = 0.35;
  var silenciada = localStorage.getItem('musicaSilenciada') === '1';

  function actualizarBoton() {
    boton.textContent = silenciada ? '🔇 Música' : '🔊 Música';
  }

  function intentarReproducir() {
    if (silenciada) return;
    audio.play().then(function () {
      quitarEscuchas();
    }).catch(function () {});
  }

  function quitarEscuchas() {
    ['click', 'touchstart', 'keydown'].forEach(function (e) {
      document.removeEventListener(e, intentarReproducir);
    });
  }

  boton.addEventListener('click', function (ev) {
    ev.stopPropagation();
    silenciada = !silenciada;
    localStorage.setItem('musicaSilenciada', silenciada ? '1' : '0');
    if (silenciada) {
      audio.pause();
    } else {
      audio.play().catch(function () {});
    }
    actualizarBoton();
  });

  ['click', 'touchstart', 'keydown'].forEach(function (e) {
    document.addEventListener(e, intentarReproducir);
  });

  actualizarBoton();
  intentarReproducir();
})();
</script>
</body>
</html>
