<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voces y Miradas de la Investigación</title>
<style>
  body { margin: 0; font-family: Georgia, serif; color: #f3efe6; text-align: center;
    background: linear-gradient(to bottom, #1f4e5a 0%, #2a6270 70%, #1a3f49 70%); }
  header { padding: 50px 20px 10px; }
  h1 { margin: 0; font-size: 2.2em; letter-spacing: 1px; }
  p.sub { color: #cfe0e3; margin-top: 8px; font-style: italic; }
  .pared { display: flex; flex-wrap: wrap; justify-content: center; gap: 50px; padding: 40px 20px 80px; }
  .cuadro { position: relative; width: 280px; background: #fffdf8; color: #2b2b2b;
    border: 14px solid #6b4a2b; box-shadow: 0 14px 24px rgba(0,0,0,0.5); padding: 12px; }
  .cuadro::before { content: ''; position: absolute; top: -70px; left: 50%; transform: translateX(-50%);
    width: 220px; height: 70px; background: radial-gradient(ellipse at bottom, rgba(255,214,140,0.55), rgba(255,214,140,0) 70%);
    pointer-events: none; }
  .cuadro h2 { font-size: 1.1em; margin: 10px 0 4px; }
  .cuadro p { font-size: 0.9em; color: #555; margin: 4px 0 10px; }
  .da { position: relative; cursor: pointer; height: 180px; background-size: cover; background-position: center; background-color: #222; }
  .portada::after { content: '▶'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 3em; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,0.7); }
  .piso { height: 90px; background: repeating-linear-gradient(90deg, #d9b98a 0, #d9b98a 70px, #c9a674 70px, #c9a674 72px); }
  #visor { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10; align-items: center; justify-content: center; flex-direction: column; }
  #visor iframe { width: 92%; max-width: 900px; height: 60vh; border: 0; background: #000; }
  #cerrar { margin-top: 16px; padding: 10px 24px; font-size: 1em; cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Voces y Miradas de la Investigación</h1>
  <p class="sub">Producciones de estudiantes de Metodología de la Investigación</p>
</header>

<section class="pared">

  <div class="cuadro">
<div class="portada" style="background-image:url('Imagenvideo1.jpg')" data-enlace="https://drive.google.com/file/d/1uEI8VsdX3wGaZz2adauKJJzVH3ecvuHr/preview"></div>
    <h2>Relación entre el uso de pantallas y el desarrollo del lenguaje en niños de 1 a 3 años</h2>
    <p>Juan Pérez · Comunicación Social · Año 2025</p>
  </div>

  <div class="cuadro">
    <div class="portada" style="background-image:url('portada-podcast1.jpg')" data-enlace="https://drive.google.com/file/d/1c9DHONaWDjxWSB9y-pElyuGZXTnT3jbz/preview"></div>
    <h2>Sin nombre</h2>
    <p>María Pérez · Fonoaudiología · Año 2025</p>
  </div>

</section>
<div class="piso"></div>

<div id="visor">
  <iframe id="marco" src="" allowfullscreen></iframe>
  <button id="cerrar">Cerrar</button>
</div>

<script>
  var visor = document.getElementById('visor');
  var marco = document.getElementById('marco');
  document.querySelectorAll('.portada').forEach(function (p) {
    p.addEventListener('click', function () {
      marco.src = p.getAttribute('data-enlace');
      visor.style.display = 'flex';
    });
  });
  document.getElementById('cerrar').addEventListener('click', function () {
    marco.src = '';
    visor.style.display = 'none';
  });
</script>
</body>
</html>
