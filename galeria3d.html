<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Galería 3D - Voces y Miradas de la Investigación</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; font-family: Georgia, serif; touch-action: none; }
  #escena { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }
  #titulo { position: fixed; top: 12px; left: 0; right: 0; text-align: center; color: #fff; text-shadow: 0 2px 6px #000; pointer-events: none; font-size: 1.1em; }
  #sala { position: fixed; top: 40px; left: 0; right: 0; text-align: center; color: #ff6600; text-shadow: 0 2px 6px #000; pointer-events: none; font-size: 1.4em; font-weight: bold; }
  #ayuda { position: fixed; bottom: 12px; right: 12px; color: #ddd; font-size: 0.8em; text-shadow: 0 1px 3px #000; pointer-events: none; text-align: right; max-width: 45%; }
  #joy { position: fixed; bottom: 30px; left: 30px; width: 110px; height: 110px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4); display: none; }
  #palanca { position: absolute; width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,0.55); left: 32px; top: 32px; }
  #visor { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.88); z-index: 10; align-items: center; justify-content: center; flex-direction: column; }
  #visor iframe { width: 92%; max-width: 900px; height: 60vh; border: 0; background: #000; }
  #cerrar { margin-top: 16px; padding: 10px 24px; font-size: 1em; cursor: pointer; }
  #info { color: #fff; margin: 0 0 10px; text-align: center; padding: 0 12px; }
</style>
</head>
<body>
<canvas id="escena"></canvas>
<div id="titulo">Voces y Miradas de la Investigación</div>
<div id="sala"></div>
<div id="ayuda">Flechas o WASD para caminar. Arrastrá para mirar. Tocá un cuadro para abrirlo. Caminá hacia la puerta para cambiar de sala.</div>
<div id="joy"><div id="palanca"></div></div>

<div id="visor">
  <p id="info"></p>
  <iframe id="marco" src="" allowfullscreen></iframe>
  <button id="cerrar">Cerrar</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
// ===== SALA 2025: 15 marcos (ANIO2025) =====
var ANIO2025 = [
  { imagen: 'portada1.jpg', enlace: 'https://drive.google.com/file/d/1uEI8VsdX3wGaZz2adauKJJzVH3ecvuHr/preview',
    titulo: 'Relación entre el uso de pantallas y el desarrollo del lenguaje en niños de 1 a 3 años',
    autor: 'Juan Pérez · Comunicación Social · Año 2025' },
  { imagen: 'portada2.jpg', enlace: 'https://drive.google.com/file/d/1c9DHONaWDjxWSB9y-pElyuGZXTnT3jbz/preview',
    titulo: 'Sin nombre',
    autor: 'María Pérez · Fonoaudiología · Año 2025' },
  { vacio: true },
  { vacio: true },
  { vacio: true },
  { vacio: true },
  { vacio: true },
  { vacio: true },
  { vacio: true },
  { vacio: true },
  { vacio: true },
  { vacio: true },
  { vacio: true },
  { vacio: true },
  { vacio: true }
];

// ===== SALA 2026: 15 marcos (ANIO2026) =====
var ANIO2026 = [
  { vacio: true },
  { vacio: true },
  { vacio: true },
  { vacio: true },
  { vacio: true },
  { vacio: true },
  { vacio: true },
  { vacio: true },
  { vacio: true },
  { vacio: true },
  { vacio: true },
  { vacio: true },
  { vacio: true },
  { vacio: true },
  { vacio: true }
];

// ===== ESCENA =====
var canvas = document.getElementById('escena');
var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x14323a);
var camera = new THREE.PerspectiveCamera(70, 1, 0.1, 100);
camera.position.set(0, 1.6, 6);

var ANCHO = 20, LARGO = 16, ALTO = 4;
var SEP = 24; // separación entre salas en el eje X

function texturaPiso() {
  var c = document.createElement('canvas'); c.width = 256; c.height = 256;
  var g = c.getContext('2d');
  for (var i = 0; i < 8; i++) {
    g.fillStyle = i % 2 ? '#d9b98a' : '#c9a674';
    g.fillRect(0, i * 32, 256, 32);
    g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(0, i * 32, 256, 2);
  }
  var t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(6, 5); return t;
}
var matPiso = new THREE.MeshLambertMaterial({ map: texturaPiso() });
var matTecho = new THREE.MeshLambertMaterial({ color: 0xf2efe8 });
var matPared = new THREE.MeshLambertMaterial({ color: 0x2a6270, side: THREE.DoubleSide });
var marcoMat = new THREE.MeshLambertMaterial({ color: 0x6b4a2b });
var vacioMat = new THREE.MeshLambertMaterial({ color: 0xe9e4d8 });

function textoTextura(texto, fondo, color) {
  var c = document.createElement('canvas'); c.width = 256; c.height = 180;
  var g = c.getContext('2d');
  g.fillStyle = fondo; g.fillRect(0, 0, 256, 180);
  g.fillStyle = color; g.font = 'bold 28px Georgia'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(texto, 128, 90);
  return new THREE.CanvasTexture(c);
}

var clicables = [];
var loader = new THREE.TextureLoader();

function construirSala(cx, lista, nombre, frase) {
  var piso = new THREE.Mesh(new THREE.PlaneGeometry(ANCHO, LARGO), matPiso);
  piso.rotation.x = -Math.PI / 2; piso.position.x = cx; scene.add(piso);
  var techo = new THREE.Mesh(new THREE.PlaneGeometry(ANCHO, LARGO), matTecho);
  techo.rotation.x = Math.PI / 2; techo.position.set(cx, ALTO, 0); scene.add(techo);
  function pared(w, x, z, ry) {
    var m = new THREE.Mesh(new THREE.PlaneGeometry(w, ALTO), matPared);
    m.position.set(cx + x, ALTO / 2, z); m.rotation.y = ry; scene.add(m);
  }
  pared(ANCHO, 0, -LARGO / 2, 0);
  pared(ANCHO, 0, LARGO / 2, Math.PI);
  pared(LARGO, -ANCHO / 2, 0, Math.PI / 2);
  pared(LARGO, ANCHO / 2, 0, -Math.PI / 2);
  var luz = new THREE.PointLight(0xffe2b0, 0.9, 40); luz.position.set(cx, 3.6, 0); scene.add(luz);

  // vigas de madera en el techo
  var matViga = new THREE.MeshLambertMaterial({ color: 0x5a3d22 });
  for (var v = -7; v <= 7; v += 3.5) {
    var viga = new THREE.Mesh(new THREE.BoxGeometry(ANCHO, 0.25, 0.3), matViga);
    viga.position.set(cx, ALTO - 0.12, v); scene.add(viga);
  }
  // focos colgantes de luz cálida
  var matFoco = new THREE.MeshBasicMaterial({ color: 0xffe2b0 });
  for (var fx = -6; fx <= 6; fx += 6) {
    for (var fz = -5; fz <= 5; fz += 5) {
      var cable = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 0.7, 6), matViga);
      cable.position.set(cx + fx, ALTO - 0.4, fz); scene.add(cable);
      var bulbo = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 12), matFoco);
      bulbo.position.set(cx + fx, ALTO - 0.8, fz); scene.add(bulbo);
    }
  }
  // alfombra bordó larga en el centro
  var alfombra = new THREE.Mesh(new THREE.PlaneGeometry(4, LARGO - 3), new THREE.MeshLambertMaterial({ color: 0x8a1050 }));
  alfombra.rotation.x = -Math.PI / 2; alfombra.position.set(cx, 0.01, 0); scene.add(alfombra);
  var bordeAlf = new THREE.Mesh(new THREE.PlaneGeometry(4.4, LARGO - 2.6), new THREE.MeshLambertMaterial({ color: 0xff6600 }));
  bordeAlf.rotation.x = -Math.PI / 2; bordeAlf.position.set(cx, 0.005, 0); scene.add(bordeAlf);
  // bancos de madera
  var matBanco = new THREE.MeshLambertMaterial({ color: 0x6b4a2b });
  [-3, 3].forEach(function (bz) {
    var asiento = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.12, 0.6), matBanco);
    asiento.position.set(cx + 3.2, 0.5, bz); scene.add(asiento);
    [-0.9, 0.9].forEach(function (px) {
      var pata = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.5, 0.5), matBanco);
      pata.position.set(cx + 3.2 + px, 0.25, bz); scene.add(pata);
    });
  });
    // letrero de la sala con frase
  var cartel = document.createElement('canvas'); cartel.width = 1024; cartel.height = 400;
  var gc = cartel.getContext('2d');
  gc.fillStyle = '#1a3f49'; gc.fillRect(0, 0, 1024, 400);
  gc.strokeStyle = '#ff6600'; gc.lineWidth = 8; gc.strokeRect(14, 14, 996, 372);
  gc.fillStyle = '#ff6600'; gc.font = 'bold 110px Georgia'; gc.textAlign = 'center'; gc.textBaseline = 'middle';
  gc.fillText(nombre, 512, 140);
  gc.fillStyle = '#ffffff'; gc.font = 'italic 52px Georgia';
  var l1 = frase.split('|')[0], l2 = frase.split('|')[1] || '';
  gc.fillText(l1, 512, 270); gc.fillText(l2, 512, 335);
  var letrero = new THREE.Mesh(new THREE.PlaneGeometry(7, 2.7), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cartel) }));
  letrero.position.set(cx, 2.4, LARGO / 2 - 0.05); letrero.rotation.y = Math.PI; scene.add(letrero);
  

  // 15 marcos: 8 en la pared del fondo, 4 en cada pared lateral (3 y 4)
  var posiciones = [];
  var i;
  for (i = 0; i < 6; i++) posiciones.push({ x: -7.5 + i * 3, z: -LARGO / 2 + 0.08, ry: 0 });
  for (i = 0; i < 5; i++) posiciones.push({ x: -ANCHO / 2 + 0.08, z: -5.5 + i * 2.75, ry: Math.PI / 2 });
  for (i = 0; i < 4; i++) posiciones.push({ x: ANCHO / 2 - 0.08, z: -4 + i * 2.75, ry: -Math.PI / 2 });

  lista.forEach(function (d, k) {
    var p = posiciones[k]; if (!p) return;
    var grupo = new THREE.Group();
    grupo.add(new THREE.Mesh(new THREE.BoxGeometry(2.1, 1.6, 0.12), marcoMat));
    var lienzo;
    if (d.vacio) {
      lienzo = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 1.3), new THREE.MeshBasicMaterial({ map: textoTextura('Próximamente', '#e9e4d8', '#6b6b6b') }));
    } else {
      lienzo = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 1.3), new THREE.MeshBasicMaterial({ map: loader.load(d.imagen) }));
      lienzo.userData = d; clicables.push(lienzo);
    }
    lienzo.position.z = 0.07; grupo.add(lienzo);
    grupo.position.set(cx + p.x, 2.0, p.z); grupo.rotation.y = p.ry; scene.add(grupo);
  });
}

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
construirSala(0, ANIO2025, 'Sala 2025', 'Primeras miradas:|donde la investigación empieza a hablar');
construirSala(SEP, ANIO2026, 'Sala 2026', 'Nuevas voces: preguntas|que siguen abriendo caminos');

// puertas: dos carteles en la pared derecha de 2025 y la izquierda de 2026, y un pasillo visual
function puerta(x, z, ry, texto) {
  var m = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.8), new THREE.MeshBasicMaterial({ map: textoTextura(texto, '#3a2a1a', '#ffd9a0') }));
  m.position.set(x, 1.4, z); m.rotation.y = ry; scene.add(m);
}
puerta(ANCHO / 2 - 0.1, 6, -Math.PI / 2, 'Sala 2026 →');
puerta(SEP - ANCHO / 2 + 0.1, 6, Math.PI / 2, '← Sala 2025');

// ===== MOVIMIENTO =====
var yaw = 0, pitch = 0;
var teclas = {};
var joyX = 0, joyY = 0;
window.addEventListener('keydown', function (e) { teclas[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', function (e) { teclas[e.key.toLowerCase()] = false; });

var esTactil = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (esTactil) document.getElementById('joy').style.display = 'block';

var arrastre = null, movido = 0;
canvas.addEventListener('pointerdown', function (e) { arrastre = { x: e.clientX, y: e.clientY, id: e.pointerId }; movido = 0; });
window.addEventListener('pointermove', function (e) {
  if (!arrastre || e.pointerId !== arrastre.id) return;
  var dx = e.clientX - arrastre.x, dy = e.clientY - arrastre.y;
  arrastre.x = e.clientX; arrastre.y = e.clientY; movido += Math.abs(dx) + Math.abs(dy);
  yaw -= dx * 0.005; pitch -= dy * 0.005; pitch = Math.max(-1.0, Math.min(1.0, pitch));
});
window.addEventListener('pointerup', function (e) {
  if (arrastre && e.pointerId === arrastre.id) {
    if (movido < 6) tocar(e.clientX, e.clientY);
    arrastre = null;
  }
});

var joy = document.getElementById('joy'), palanca = document.getElementById('palanca');
var joyId = null;
joy.addEventListener('pointerdown', function (e) { e.stopPropagation(); joyId = e.pointerId; joy.setPointerCapture(e.pointerId); moverPalanca(e); });
joy.addEventListener('pointermove', function (e) { if (e.pointerId === joyId) moverPalanca(e); });
joy.addEventListener('pointerup', function () { joyId = null; joyX = 0; joyY = 0; palanca.style.left = '32px'; palanca.style.top = '32px'; });
function moverPalanca(e) {
  var r = joy.getBoundingClientRect();
  var dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  var d = Math.sqrt(dx * dx + dy * dy), max = 40;
  if (d > max) { dx = dx / d * max; dy = dy / d * max; }
  palanca.style.left = (32 + dx) + 'px'; palanca.style.top = (32 + dy) + 'px';
  joyX = dx / max; joyY = dy / max;
}

// ===== CLIC EN CUADRO =====
var ray = new THREE.Raycaster();
function tocar(px, py) {
  var v = new THREE.Vector2((px / window.innerWidth) * 2 - 1, -(py / window.innerHeight) * 2 + 1);
  ray.setFromCamera(v, camera);
  var hit = ray.intersectObjects(clicables)[0];
  if (hit) abrir(hit.object.userData);
}
var visor = document.getElementById('visor'), marco = document.getElementById('marco'), info = document.getElementById('info');
function abrir(d) {
  info.textContent = d.titulo + ' — ' + d.autor;
  marco.src = d.enlace;
  visor.style.display = 'flex';
  if (window.pausarMusicaFondo) window.pausarMusicaFondo();
}
document.getElementById('cerrar').addEventListener('click', function () {
  marco.src = '';
  visor.style.display = 'none';
  if (window.reanudarMusicaFondo) window.reanudarMusicaFondo();
});

// ===== BUCLE =====
function ajustar() { renderer.setSize(window.innerWidth, window.innerHeight, false); camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); }
window.addEventListener('resize', ajustar); ajustar();

var etiquetaSala = document.getElementById('sala');
var ultimo = performance.now();
function animar(t) {
  var dt = Math.min((t - ultimo) / 1000, 0.05); ultimo = t;
  var adelante = 0, lado = 0;
  if (teclas['w'] || teclas['arrowup']) adelante += 1;
  if (teclas['s'] || teclas['arrowdown']) adelante -= 1;
  if (teclas['a'] || teclas['arrowleft']) lado -= 1;
  if (teclas['d'] || teclas['arrowright']) lado += 1;
  adelante += -joyY; lado += joyX;
  var vel = 3.5 * dt;
  camera.position.x += (-Math.sin(yaw) * adelante + Math.cos(yaw) * lado) * vel;
  camera.position.z += (-Math.cos(yaw) * adelante - Math.sin(yaw) * lado) * vel;

  // límites: dentro de la sala actual; la puerta (z cerca de 6) conecta ambas salas
  var zLim = LARGO / 2 - 0.6;
  camera.position.z = Math.max(-zLim, Math.min(zLim, camera.position.z));
  var enPuerta = camera.position.z > 4.5 && camera.position.z < 7.5;
  var xMin = -ANCHO / 2 + 0.6, xMax = SEP + ANCHO / 2 - 0.6;
  var xFinSala1 = ANCHO / 2 - 0.6, xInicioSala2 = SEP - ANCHO / 2 + 0.6;
  if (!enPuerta) {
    if (camera.position.x > xFinSala1 && camera.position.x < SEP / 2) camera.position.x = xFinSala1;
    if (camera.position.x < xInicioSala2 && camera.position.x >= SEP / 2) camera.position.x = xInicioSala2;
  }
  camera.position.x = Math.max(xMin, Math.min(xMax, camera.position.x));

  etiquetaSala.textContent = camera.position.x < SEP / 2 ? 'Sala 2025' : 'Sala 2026';
  camera.rotation.order = 'YXZ'; camera.rotation.y = yaw; camera.rotation.x = pitch;
  renderer.render(scene, camera);
  requestAnimationFrame(animar);
}
requestAnimationFrame(animar);
</script>
<audio id="musicaFondo" src="musica.mp3" loop preload="auto"></audio>
<script>
(function () {
  var audio = document.getElementById('musicaFondo');
  var boton = document.getElementById('botonMusica');
  audio.volume = 0.35;
  var silenciada = localStorage.getItem('musicaSilenciada') === '1';
  var visorAbierto = false;

  function actualizarBoton() {
    boton.textContent = silenciada ? '🔇 Música' : '🔊 Música';
  }

  function intentarReproducir() {
    if (silenciada || visorAbierto) return;
    audio.play().then(function () {
      quitarEscuchas();
    }).catch(function () {});
  }

  function quitarEscuchas() {
    ['click', 'touchstart', 'keydown'].forEach(function (e) {
      document.removeEventListener(e, intentarReproducir);
    });
  }

  boton.addEventListener('click', function (ev) {
    ev.stopPropagation();
    silenciada = !silenciada;
    localStorage.setItem('musicaSilenciada', silenciada ? '1' : '0');
    if (silenciada) {
      audio.pause();
    } else if (!visorAbierto) {
      audio.play().catch(function () {});
    }
    actualizarBoton();
  });

  // Las usa el visor de videos/podcast
  window.pausarMusicaFondo = function () {
    visorAbierto = true;
    audio.pause();
  };
  window.reanudarMusicaFondo = function () {
    visorAbierto = false;
    if (!silenciada) audio.play().catch(function () {});
  };

  ['click', 'touchstart', 'keydown'].forEach(function (e) {
    document.addEventListener(e, intentarReproducir);
  });

  actualizarBoton();
  intentarReproducir();
})();
</script>
</body>
</html>
